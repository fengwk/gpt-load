name: Docker Publish

on:
  push:
    branches:
      - docker
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY || 'gpt-load' }}

jobs:
  publish:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 校验 Docker Hub 配置
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "::error::缺少 DOCKERHUB_USERNAME secret"
            exit 1
          fi

          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::error::缺少 DOCKERHUB_TOKEN secret"
            exit 1
          fi

          if [ -z "${{ env.DOCKERHUB_NAMESPACE }}" ]; then
            echo "::error::缺少 Docker Hub 命名空间，请设置仓库变量 DOCKERHUB_NAMESPACE 或使用 DOCKERHUB_USERNAME secret"
            exit 1
          fi

          if [ -z "${{ env.DOCKERHUB_REPOSITORY }}" ]; then
            echo "::error::缺少 Docker Hub 仓库名，请设置仓库变量 DOCKERHUB_REPOSITORY"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.DOCKERHUB_REPOSITORY }}
          tags: |
            type=raw,value=docker
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.sha }}
